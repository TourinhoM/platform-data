# Identidade dos Jobs de seeding da composition AppDatabase (platform-apis).
# Cada Job de provisionamento de banco roda com esta SA pra logar no Vault via
# k8s auth (role appdatabase-seeder, policy appdatabase-write — configmap-bootstrap
# em platform-security) e publicar a conexão em secret/databases/<env>/<app>.
# Token EFÊMERO (login no boot do Job); nenhum token fixo em lugar nenhum.
# Singleton (não per-claim): o role do Vault é bound a este nome+ns (infra).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appdatabase-seeder
