apiVersion: batch/v1
kind: Job
metadata:
  name: create-dtrack-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 20
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: PGHOST
              value: postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgresql -p 5432; do sleep 2; done
      containers:
        - name: psql
          image: postgres:16
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: PGHOST
              value: postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: POSTGRES_PASSWORD
            - name: DTRACK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: DTRACK_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              psql -v ON_ERROR_STOP=1 -d postgres -v "dtrack_pw=${DTRACK_PASSWORD}" <<'EOF'
                SET "dtrack.pw" = :'dtrack_pw';
                DO $body$
                DECLARE pw TEXT := current_setting('dtrack.pw');
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'dtrack') THEN
                    EXECUTE format('CREATE USER dtrack WITH PASSWORD %L', pw);
                  ELSE
                    EXECUTE format('ALTER USER dtrack WITH PASSWORD %L', pw);
                  END IF;
                END $body$;
                SELECT 'CREATE DATABASE dtrack OWNER dtrack'
                WHERE NOT EXISTS (
                  SELECT FROM pg_database WHERE datname = 'dtrack'
                )\gexec
                GRANT ALL PRIVILEGES ON DATABASE dtrack TO dtrack;
              EOF
